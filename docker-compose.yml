services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiber_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - APP_NAME=FiberApp
      - APP_PORT=:3000
      - APP_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=secret
      - DB_NAME=fiber_db
      - DB_SSLMODE=disable
      - DB_ENABLE=true
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: fiber_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: fiber_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fiber_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
